<!doctype html>
<html><head><meta charset="utf-8"><title>gl probe</title></head>
<body style="background:#000;color:#ddd;font:12px monospace">
<pre id="out">running…</pre>
<script>
(async () => {
  const r = {};
  try {
    const c = document.createElement('canvas'); c.width = 64; c.height = 64;
    const gl = c.getContext('webgl2', { antialias: false, alpha: false, premultipliedAlpha: true, preserveDrawingBuffer: false, powerPreference: 'high-performance' });
    r.webgl2 = !!gl;
    if (gl) {
      const dbg = gl.getExtension('WEBGL_debug_renderer_info');
      r.renderer = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
      r.EXT_color_buffer_float = !!gl.getExtension('EXT_color_buffer_float');
      r.EXT_float_blend = !!gl.getExtension('EXT_float_blend');
      r.maxTex = gl.getParameter(gl.MAX_TEXTURE_SIZE);
      r.pointSize = Array.from(gl.getParameter(gl.ALIASED_POINT_SIZE_RANGE));
      r.maxVertexAttribs = gl.getParameter(gl.MAX_VERTEX_ATTRIBS);
      const fboOk = (internal, format, type) => {
        const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
        gl.texImage2D(gl.TEXTURE_2D, 0, internal, 4, 4, 0, format, type, null);
        const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
        const st = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
        gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.deleteFramebuffer(f); gl.deleteTexture(t);
        return st;
      };
      r.rgba16fTarget = fboOk(gl.RGBA16F, gl.RGBA, gl.HALF_FLOAT);
      r.r32uiTarget = fboOk(gl.R32UI, gl.RED_INTEGER, gl.UNSIGNED_INT);
      // additive blend into RGBA16F works only with float blending allowed for half-float (core in WebGL2 w/ EXT_color_buffer_float)
      r.fenceSync = typeof gl.fenceSync === 'function';
    }
  } catch (e) { r.glError = String(e); }
  try {
    const src = `self.onmessage = (e) => { const a = new Float32Array(e.data.buf); let s = 0; for (let i = 0; i < a.length; i++) s += a[i]; const out = new Float32Array(a.length); out.fill(2); self.postMessage({ sum: s, buf: out.buffer }, [out.buffer]); };`;
    const url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
    const w = new Worker(url);
    const res = await new Promise((resolve, reject) => {
      const t = setTimeout(() => reject(new Error('timeout')), 3000);
      w.onmessage = (e) => { clearTimeout(t); resolve(e.data); };
      w.onerror = (e) => { clearTimeout(t); reject(new Error(e.message)); };
      const a = new Float32Array(300000); a.fill(1);
      w.postMessage({ buf: a.buffer }, [a.buffer]);
      r.transferDetached = a.byteLength === 0;
    });
    r.blobWorker = true; r.workerSum = res.sum; r.workerReturnLen = new Float32Array(res.buf).length;
    w.terminate(); URL.revokeObjectURL(url);
  } catch (e) { r.blobWorker = false; r.workerError = String(e); }
  r.offscreenCanvas = typeof OffscreenCanvas === 'function';
  r.requestIdleCallback = typeof requestIdleCallback === 'function';
  r.schedulerYield = typeof (globalThis.scheduler && globalThis.scheduler.yield) === 'function';
  r.ua = navigator.userAgent;
  r.dpr = devicePixelRatio;
  window.__probe = r;
  document.getElementById('out').textContent = JSON.stringify(r, null, 2);
})();
</script>
</body></html>
